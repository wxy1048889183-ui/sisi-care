<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 守护我的小可爱 · 思思</title>
<style>
/* ========== CSS Variables & Reset ========== */
:root {
  --bg-deep: #1a0a1e;
  --bg-mid: #2d1b3d;
  --bg-card: rgba(45, 27, 61, 0.85);
  --purple: #9B59B6;
  --purple-light: #C39BD3;
  --pink: #FF69B4;
  --pink-light: #FFB6C1;
  --pink-warm: #FF85A2;
  --white: #f5e6f7;
  --text: #e8d5f0;
  --text-dim: #b8a0c0;
  --gold: #FFD700;
  --danger: #FF6B8A;
  --success: #6BCB77;
  --shadow: 0 4px 20px rgba(155, 89, 182, 0.25);
  --border-glow: 0 0 15px rgba(155, 89, 182, 0.4);
  --radius: 20px;
  --radius-sm: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-deep);
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(155, 89, 182, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 60%, rgba(255, 105, 180, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 90%, rgba(195, 155, 211, 0.08) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ========== Floating Background Decorations ========== */
.bg-decoration {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.3;
  animation: float 6s ease-in-out infinite;
}
.bg-decoration:nth-child(1) { top: 5%; left: 5%; font-size: 3rem; animation-delay: 0s; }
.bg-decoration:nth-child(2) { top: 15%; right: 8%; font-size: 2.5rem; animation-delay: 1.5s; }
.bg-decoration:nth-child(3) { bottom: 20%; left: 10%; font-size: 2rem; animation-delay: 3s; }
.bg-decoration:nth-child(4) { bottom: 10%; right: 12%; font-size: 2.8rem; animation-delay: 4.5s; }
.bg-decoration:nth-child(5) { top: 50%; right: 5%; font-size: 1.8rem; animation-delay: 2s; }
.bg-decoration:nth-child(6) { top: 40%; left: 3%; font-size: 2.2rem; animation-delay: 5s; }

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(3deg); }
  50% { transform: translateY(-5px) rotate(-2deg); }
  75% { transform: translateY(-20px) rotate(1deg); }
}

/* ========== Header ========== */
header {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 30px 20px 10px;
}
.header-crown {
  display: inline-block;
  font-size: 2.5rem;
  animation: crownBounce 2s ease-in-out infinite;
}
@keyframes crownBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.header-title {
  font-size: 2.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, #C39BD3, #FF69B4, #FFB6C1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 3px;
  margin: 5px 0;
}
.header-subtitle {
  font-size: 0.95rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-top: 2px;
}

/* ========== Main Layout ========== */
.main-container {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 15px 20px 30px;
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 20px;
}

/* ========== Card Base ========== */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(155, 89, 182, 0.3);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
  transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(155, 89, 182, 0.35);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--purple-light);
}
.card-header .icon { font-size: 1.4rem; }

/* ========== Calendar Section ========== */
.calendar-section { display: flex; flex-direction: column; gap: 16px; }

.calendar-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}
.calendar-nav button {
  background: rgba(155, 89, 182, 0.3);
  border: 1px solid rgba(155, 89, 182, 0.5);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.calendar-nav button:hover {
  background: var(--purple);
  box-shadow: var(--border-glow);
}
.calendar-month-label {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--pink-light);
  letter-spacing: 1px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}
.calendar-day-header {
  font-size: 0.78rem;
  color: var(--pink);
  font-weight: 600;
  padding: 6px 0;
}
.calendar-day-header.weekend { color: var(--pink-warm); }

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.9rem;
  position: relative;
  transition: all 0.2s;
  color: var(--text);
  min-width: 38px;
}
.calendar-day:hover {
  background: rgba(155, 89, 182, 0.35);
  transform: scale(1.08);
}
.calendar-day.other-month { color: var(--text-dim); opacity: 0.4; cursor: default; }
.calendar-day.today {
  border: 2px solid var(--pink);
  font-weight: 700;
  color: var(--pink-light);
  box-shadow: 0 0 12px rgba(255, 105, 180, 0.3);
}
.calendar-day.period-day {
  background: rgba(255, 107, 138, 0.35) !important;
  color: #FFB6C1 !important;
  font-weight: 700;
  position: relative;
}
.calendar-day.period-day::after {
  content: '🌸';
  position: absolute;
  bottom: -2px;
  font-size: 0.55rem;
}
.calendar-day.predicted-period {
  border: 1.5px dashed var(--pink-warm);
  color: var(--pink-warm);
}
.calendar-day.predicted-period::after {
  content: '💧';
  position: absolute;
  bottom: -2px;
  font-size: 0.5rem;
  opacity: 0.7;
}

.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 5px 0;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
}
.legend-dot.period { background: rgba(255, 107, 138, 0.5); }
.legend-dot.predicted { border: 2px dashed var(--pink-warm); background: transparent; }

.cycle-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 20px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 1px;
  transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, #9B59B6, #C39BD3);
  color: white;
  box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
}
.btn-primary:hover {
  box-shadow: 0 6px 25px rgba(155, 89, 182, 0.6);
  transform: translateY(-2px);
}
.btn-secondary {
  background: rgba(255, 107, 138, 0.3);
  border: 1px solid rgba(255, 107, 138, 0.5);
  color: var(--pink-light);
}
.btn-secondary:hover {
  background: rgba(255, 107, 138, 0.5);
}
.btn-outline {
  background: transparent;
  border: 1px solid rgba(155, 89, 182, 0.6);
  color: var(--purple-light);
}
.btn-outline:hover {
  background: rgba(155, 89, 182, 0.25);
}

/* ========== Right Panel Cards ========== */
.right-panel { display: flex; flex-direction: column; gap: 16px; }

.quote-card { position: relative; overflow: hidden; }
.quote-card::before {
  content: '"';
  position: absolute;
  top: -20px; right: 15px;
  font-size: 6rem;
  color: rgba(155, 89, 182, 0.15);
  font-family: Georgia, serif;
  line-height: 1;
}
.quote-text {
  font-size: 1.05rem;
  line-height: 1.8;
  color: var(--text);
  font-style: italic;
  position: relative;
  z-index: 1;
  padding: 5px 0;
}
.quote-text::before { content: '💬 '; }
.quote-author {
  text-align: right;
  color: var(--pink);
  font-size: 0.85rem;
  margin-top: 8px;
  font-weight: 600;
}
.quote-refresh {
  display: inline-block;
  margin-top: 10px;
  font-size: 0.75rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.3s;
}
.quote-refresh:hover { color: var(--pink); }

.weather-card .weather-main {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.weather-icon { font-size: 3rem; }
.weather-temp { font-size: 2.5rem; font-weight: 700; color: var(--pink-light); }
.weather-desc { color: var(--text-dim); font-size: 0.9rem; }
.weather-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-dim);
}
.weather-detail span { color: var(--text); font-weight: 600; }

.advice-box {
  margin-top: 12px;
  padding: 12px 15px;
  background: rgba(155, 89, 182, 0.15);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--pink);
  font-size: 0.88rem;
  line-height: 1.7;
}
.advice-box .advice-label {
  font-weight: 700;
  color: var(--pink-warm);
  margin-bottom: 3px;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat-item {
  text-align: center;
  padding: 12px 8px;
  background: rgba(155, 89, 182, 0.12);
  border-radius: var(--radius-sm);
}
.stat-value {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--pink-light);
}
.stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 3px;
}

.night-shift-card {
  background: linear-gradient(135deg, rgba(45, 27, 61, 0.9), rgba(75, 35, 95, 0.85));
  border-color: rgba(255, 215, 0, 0.3);
}
.night-shift-tips {
  list-style: none;
  padding: 0;
}
.night-shift-tips li {
  padding: 6px 0 6px 25px;
  position: relative;
  font-size: 0.88rem;
  color: var(--text-dim);
  line-height: 1.6;
}
.night-shift-tips li::before {
  content: '🌙';
  position: absolute;
  left: 0;
  font-size: 0.75rem;
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--purple);
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 0.9rem;
  z-index: 1000;
  box-shadow: var(--border-glow);
  animation: toastIn 0.4s ease-out, toastOut 0.4s ease-in 2s forwards;
  pointer-events: none;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .main-container {
    grid-template-columns: 1fr;
    padding: 10px 15px 20px;
  }
  .header-title { font-size: 1.6rem; }
  .calendar-day { font-size: 0.78rem; min-width: 30px; }
  .weather-temp { font-size: 2rem; }
}

@media (max-width: 400px) {
  .header-title { font-size: 1.3rem; letter-spacing: 1px; }
  .card { padding: 15px; }
  .calendar-grid { gap: 2px; }
}
</style>
</head>
<body>

<!-- Floating bg decorations -->
<div class="bg-decoration">💜</div>
<div class="bg-decoration">🎀</div>
<div class="bg-decoration">⭐</div>
<div class="bg-decoration">🌙</div>
<div class="bg-decoration">🌸</div>
<div class="bg-decoration">🦇</div>

<!-- Header -->
<header>
  <div class="header-crown">👑</div>

<!-- Main Content -->
<div class="main-container">

        <li>你辛苦了，记得对自己好一点 💜</li>
      </ul>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none;"></div>

<script>
// ==================== DATA ====================

// Encouraging quotes
const quotes = [
  { text: '你今天的样子，就是最好的样子。不需要成为别人，你本身就是独一无二的光。', author: '写给你的话' },

// ==================== STATE ====================
let currentYear, currentMonth;
let periodDates = new Set(); // 'YYYY-MM-DD' strings

// ==================== LOCAL STORAGE ====================
function loadPeriodData() {
  try {
    const data = localStorage.getItem('kuromi_period_dates');
    if (data) {
      periodDates = new Set(JSON.parse(data));
    }
  } catch(e) {
    periodDates = new Set();
  }
}

function savePeriodData() {
  try {
    localStorage.setItem('kuromi_period_dates', JSON.stringify([...periodDates]));
  } catch(e) {}
}

// ==================== TOAST ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  toast.style.animation = 'none';
  toast.offsetHeight;
  toast.style.animation = 'toastIn 0.4s ease-out, toastOut 0.4s ease-in 2s forwards';
  setTimeout(() => { toast.style.display = 'none'; }, 2400);
}

// ==================== DATE HELPERS ====================
function formatDate(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

function firstDayOfMonth(y, m) {
  return new Date(y, m, 1).getDay();
}

function dateToKey(date) {
  return formatDate(date.getFullYear(), date.getMonth(), date.getDate());
}

// ==================== PERIOD ANALYSIS ====================
function getPeriodGroups() {
  const sorted = [...periodDates].sort();
  if (sorted.length === 0) return [];
  const groups = [];
  let group = [sorted[0]];
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i - 1]);
    const curr = new Date(sorted[i]);
    const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
    if (diffDays <= 2) {
      group.push(sorted[i]);
    } else {
      groups.push(group);
      group = [sorted[i]];
    }
  }
  groups.push(group);
  return groups;
}

function calculateStats() {
  const groups = getPeriodGroups();
  if (groups.length === 0) return { avgCycle: null, avgDuration: null, nextPredicted: null, nextEnd: null };

  const durations = groups.map(g => g.length);
  const avgDuration = Math.round(durations.reduce((a, b) => a + b, 0) / durations.length);

  const cycles = [];
  for (let i = 1; i < groups.length; i++) {
    const prevStart = new Date(groups[i - 1][0]);
    const currStart = new Date(groups[i][0]);
    cycles.push(Math.round((currStart - prevStart) / (1000 * 60 * 60 * 24)));
  }
  const avgCycle = cycles.length > 0 ? Math.round(cycles.reduce((a, b) => a + b, 0) / cycles.length) : 28;

  const lastGroup = groups[groups.length - 1];
  const lastStart = new Date(lastGroup[0]);
  const nextStart = new Date(lastStart);
  nextStart.setDate(nextStart.getDate() + avgCycle);
  const nextEnd = new Date(nextStart);
  nextEnd.setDate(nextEnd.getDate() + avgDuration - 1);

  return {
    avgCycle,
    avgDuration,
    nextPredicted: dateToKey(nextStart),
    nextEnd: dateToKey(nextEnd),
    lastGroup: lastGroup,
  };
}

function getCurrentStatus() {
  const today = dateToKey(new Date());
  if (periodDates.has(today)) {
    const sorted = [...periodDates].sort();
    const groups = getPeriodGroups();
    for (const g of groups) {
      if (g.includes(today)) {
        const idx = g.indexOf(today);
        return `经期第 ${idx + 1} 天`;
      }
    }
    return '经期中';
  }

  const stats = calculateStats();
  if (stats.nextPredicted) {
    const nextDate = new Date(stats.nextPredicted);
    const todayDate = new Date();
    const diff = Math.round((nextDate - todayDate) / (1000 * 60 * 60 * 24));
    if (diff <= 7 && diff > 0) return `距下次约 ${diff} 天`;
    if (diff <= 0 && stats.nextEnd >= today) return '预计经期中';
    return '安全期';
  }
  return '暂无数据';
}

// ==================== CALENDAR RENDER ====================
function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('monthLabel');

  const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
  label.textContent = `${currentYear}年 ${months[currentMonth]}`;

  const dayHeaders = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '';
  dayHeaders.forEach((d, i) => {
    const cls = (i === 0 || i === 6) ? ' weekend' : '';
    html += `<div class="calendar-day-header${cls}">${d}</div>`;
  });

  const daysInM = daysInMonth(currentYear, currentMonth);
  const firstDay = firstDayOfMonth(currentYear, currentMonth);
  const prevMonthDays = daysInMonth(currentYear, currentMonth - 1 < 0 ? 11 : currentMonth - 1);

  const todayKey = dateToKey(new Date());
  const stats = calculateStats();

  // Previous month days
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = prevMonthDays - i;
    html += `<div class="calendar-day other-month">${d}</div>`;
  }

  // Current month days
  for (let d = 1; d <= daysInM; d++) {
    const key = formatDate(currentYear, currentMonth, d);
    let cls = 'calendar-day';
    if (key === todayKey) cls += ' today';
    if (periodDates.has(key)) cls += ' period-day';

    // Predicted period
    if (stats.nextPredicted && stats.nextEnd) {
      if (key >= stats.nextPredicted && key <= stats.nextEnd && !periodDates.has(key)) {
        cls += ' predicted-period';
      }
    }

    html += `<div class="${cls}" data-date="${key}" onclick="togglePeriodDate('${key}', this)">${d}</div>`;
  }

  // Next month days
  const totalCells = firstDay + daysInM;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="calendar-day other-month">${d}</div>`;
  }

  grid.innerHTML = html;
  updateStats();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function togglePeriodDate(key, el) {
  if (el && el.classList.contains('other-month')) return;
  if (periodDates.has(key)) {
    periodDates.delete(key);
    showToast('🌸 已取消经期标记');
  } else {
    periodDates.add(key);
    showToast('🌸 已标记为经期日');
  }
  savePeriodData();
  renderCalendar();
}

function markPeriodToday() {
  const key = dateToKey(new Date());
  periodDates.add(key);
  savePeriodData();
  showToast('🌸 今天已标记为经期日，照顾好自己哦~');
  renderCalendar();
}

function clearPeriodToday() {
  const key = dateToKey(new Date());
  if (periodDates.has(key)) {
    periodDates.delete(key);
    savePeriodData();
    showToast('已取消今天的经期标记');
  } else {
    showToast('今天没有经期标记哦~');
  }
  renderCalendar();
}

function clearAllPeriods() {
  if (confirm('确定要清除所有经期记录吗？这个操作不可恢复哦。')) {
    periodDates.clear();
    savePeriodData();
    renderCalendar();
    showToast('🗑 所有经期记录已清除');
  }
}

function updateStats() {
  const stats = calculateStats();
  document.getElementById('statCycle').textContent = stats.avgCycle || '--';
  document.getElementById('statDuration').textContent = stats.avgDuration || '--';
  if (stats.nextPredicted) {
    const d = new Date(stats.nextPredicted);
    document.getElementById('statNext').textContent = `${d.getMonth() + 1}/${d.getDate()}`;
  } else {
    document.getElementById('statNext').textContent = '--';
  }
  document.getElementById('statStatus').textContent = getCurrentStatus();
}

// ==================== QUOTES ====================
function getDailyQuote() {
  const today = new Date();
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
  return quotes[dayOfYear % quotes.length];
}

function renderQuote() {
  const q = getDailyQuote();
  document.getElementById('quoteText').textContent = q.text;
  document.getElementById('quoteAuthor').textContent = '── ' + q.author;
}

function refreshQuote() {
  const randomIdx = Math.floor(Math.random() * quotes.length);
  const q = quotes[randomIdx];
  document.getElementById('quoteText').textContent = q.text;
  document.getElementById('quoteAuthor').textContent = '── ' + q.author;
  showToast('💬 已为你换一句暖心话~');
}

// ==================== WEATHER ====================
async function fetchWeather() {
  const lat = 29.29;
  const lon = 120.23;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Shanghai&forecast_days=1`;

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('API error');
    const data = await resp.json();

    const current = data.current;
    const daily = data.daily;
    const code = current.weather_code;
    const w = weatherMap[code] || { desc: '未知', icon: '🌈', advice: '今天也要元气满满哦！不管什么天气，心情好就是好天气~' };

    const temp = Math.round(current.temperature_2m);
    const feelsLike = Math.round(current.apparent_temperature);
    const humidity = current.relative_humidity_2m;
    const windSpeed = current.wind_speed_10m;
    const maxTemp = daily ? Math.round(daily.temperature_2m_max[0]) : null;
    const minTemp = daily ? Math.round(daily.temperature_2m_min[0]) : null;
    const precipProb = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;

    document.getElementById('weatherContent').innerHTML = `
      <div class="weather-main">
        <span class="weather-icon">${w.icon}</span>
        <div>
          <div class="weather-temp">${temp}°C</div>
          <div class="weather-desc">${w.desc} · 体感 ${feelsLike}°C</div>
        </div>
      </div>
      <div class="weather-detail">
        <div>💧 湿度：<span>${humidity}%</span></div>
        <div>💨 风速：<span>${windSpeed} km/h</span></div>
        ${maxTemp !== null ? `<div>🔺 最高：<span>${maxTemp}°C</span></div>` : ''}
        ${minTemp !== null ? `<div>🔻 最低：<span>${minTemp}°C</span></div>` : ''}
        ${precipProb !== null ? `<div>🌧 降雨概率：<span>${precipProb}%</span></div>` : ''}
      </div>
      <div class="advice-box">
        <div class="advice-label">💡 出行建议</div>
        ${w.advice}
        ${temp < 10 ? '<br>⚠️ 天气较冷，出门穿暖和点，尤其注意腹部保暖！' : ''}
        ${temp > 30 ? '<br>⚠️ 天气炎热，注意防暑防晒，多喝水哦！' : ''}
        ${precipProb && precipProb > 50 ? '<br>⚠️ 降雨概率较高，记得带伞！' : ''}
      </div>
      <div style="font-size:0.7rem;color:var(--text-dim);margin-top:8px;text-align:right;">数据更新时间：${new Date(current.time).toLocaleTimeString('zh-CN')}</div>
    `;
  } catch (e) {
    document.getElementById('weatherContent').innerHTML = `
      <div style="text-align:center;padding:15px;color:var(--text-dim);">
        <p>😢 天气数据暂时获取失败</p>
        <p style="font-size:0.8rem;">请检查网络连接后刷新页面重试</p>
        <button class="btn btn-outline" style="margin-top:10px;font-size:0.75rem;" onclick="fetchWeather()">🔄 重新获取</button>
      </div>
    `;
  }
}

// ==================== INIT ====================
function init() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();

  loadPeriodData();
  renderCalendar();
  renderQuote();
  fetchWeather();
}

// Run on page load
document.addEventListener('DOMContentLoaded', init);
</script>
